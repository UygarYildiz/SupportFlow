# Local development stack.
#   docker compose up -d db          -> only Postgres (run backend/frontend on the host)
#   docker compose up --build        -> Postgres + backend + frontend in containers
name: supportflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: supportflow
      POSTGRES_DB: supportflow
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # LLM_MODE, GEMINI_API_KEY etc. come from .env; `environment` below takes precedence.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://supportflow:supportflow@db:5432/supportflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic

  frontend:
    image: node:24-alpine
    working_dir: /app
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
