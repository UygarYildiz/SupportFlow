[project]
name = "supportflow-backend"
version = "0.1.0"
description = "SupportFlow AI backend: FastAPI API, domain services and LangGraph agent"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = []

[tool.ruff.lint.isort]
# The local `alembic/` migrations folder must not shadow the alembic package.
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are fine in tests

[tool.pyright]
include = ["app", "tests", "alembic", "scripts"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: test needs a reachable PostgreSQL test database",
]

[tool.poe.tasks]
dev = { cmd = "uvicorn app.main:app --reload --host 127.0.0.1 --port 8000", help = "Run the API with auto-reload" }
lint = { cmd = "ruff check .", help = "Lint" }
format = { cmd = "ruff format .", help = "Format code" }
format-check = { cmd = "ruff format --check .", help = "Check formatting" }
typecheck = { cmd = "pyright", help = "Static type check" }
test = { cmd = "pytest", help = "Run tests (extra args are passed through)" }
migrate = { cmd = "alembic upgrade head", help = "Apply migrations" }
seed = { cmd = "python -m scripts.seed_demo", help = "Insert demo data (add --reset to wipe first)" }
check = { sequence = ["lint", "format-check", "typecheck", "test"], help = "Everything CI runs" }
