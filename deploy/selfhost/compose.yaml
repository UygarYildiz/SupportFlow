# SupportFlow for one business on its own machine or server (ADR-017).
#
#   ./init.sh            (Windows: .\init.ps1)  -> writes .env with random secrets
#   docker compose up -d --build                -> http://localhost:8080 opens the setup
#
# See docs/SELF_HOSTING.md. Data lives in the `pgdata` volume; back it up.
name: supportflow-selfhost

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: supportflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run init.sh / init.ps1 first}
      POSTGRES_DB: supportflow
    # No published port: only the backend reaches the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supportflow -d supportflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ../../backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DEPLOYMENT_MODE: self_hosted
      # The password stays out of the URL: libpq (psycopg) reads it from PGPASSWORD.
      DATABASE_URL: postgresql+psycopg://supportflow@db:5432/supportflow
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?run init.sh / init.ps1 first}
      SETUP_TOKEN: ${SETUP_TOKEN:?run init.sh / init.ps1 first}
      LLM_MODE: ${LLM_MODE:-fake}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      EMBEDDING_MODE: ${EMBEDDING_MODE:-fake}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../../frontend
    restart: unless-stopped
    ports:
      - "${SUPPORTFLOW_BIND:-127.0.0.1}:${SUPPORTFLOW_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  pgdata:
